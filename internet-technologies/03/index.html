<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог пользователей</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

<h1>Каталог пользователей</h1>

<button id="loadButton">Загрузить</button>
<button id="updateButton">Обновить</button>

<p id="status">Нажмите кнопку "Загрузить".</p>

<input
    id="searchInput"
    type="text"
    placeholder="Поиск по имени, username или email"
>

<div id="usersList"></div>

<h2>Статистика</h2>

<p>Всего пользователей</p>
<p id="totalCount">Всего пользователей: 0</p>
<p id="filteredCount">Отображается: 0</p>
<p id="citiesCount">Уникальных городов: 0</p>

</body>
</html>
