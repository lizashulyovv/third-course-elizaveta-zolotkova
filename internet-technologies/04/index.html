<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD-интерфейс для публикаций</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <h1>CRUD-интерфейс для публикаций</h1>

    <button id="loadButton" type="button">Загрузить публикации</button>

    <p id="status">Нажмите кнопку, чтобы загрузить публикации.</p>

    <h2 id="formTitle">Новая публикация</h2>

    <form id="postForm">
        <label for="titleInput">Заголовок</label>
        <input type="text" id="titleInput" required>

        <label for="bodyInput">Текст публикации</label>
        <textarea id="bodyInput" rows="4" required></textarea>

        <button id="saveButton" type="submit">Сохранить</button>
        <button id="cancelButton" type="button" hidden>Отмена</button>
    </form>

    <p id="formStatus"></p>

    <h2>Публикации</h2>

    <input
        type="search"
        id="searchInput"
        placeholder="Поиск по заголовку или тексту"
    >

    <div id="postsList"></div>
</body>
</html>
