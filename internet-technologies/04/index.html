
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD - публикации</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Публикации</h1>

    <section>
        <h2 id="formTitle">Новая публикация</h2>

        <form id="postForm">
            <label for="titleInput">Заголовок</label>
            <input type="text" id="titleInput" placeholder="Введите заголовок">

            <label for="bodyInput">Текст</label>
            <textarea id="bodyInput" placeholder="Введите текст публикации"></textarea>

            <button type="submit" id="saveButton">Сохранить</button>
            <button type="button" id="cancelButton">Отмена</button>
        </form>

    </section>

    <section>
        <h2>Поиск публикаций</h2>
        <input type="text" id="searchInput" placeholder="Поиск по заголовку и тексту">
    </section>

    <section>
        <h2>Список публикаций</h2>

        <button type="button" id="loadButton">Загрузить публикации</button>

        <p id="status"></p>

        <div id="postsList"></div>
    </section>

    <script src="app.js"></script>
</body>
</html>
